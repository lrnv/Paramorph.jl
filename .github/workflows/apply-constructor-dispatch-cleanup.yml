name: Apply constructor dispatch cleanup

on:
  push:
    branches:
      - paramorph-0.0.3-dsl

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paramorph-0.0.3-dsl
      - name: Apply cleanup
        run: python dev/disable_auxiliary_inferred_constructors.py
      - name: Commit source/tests/docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Paramorph.jl test/runtests.jl docs/src/tutorial.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Avoid inferred constructors for auxiliary-field models"
            git push origin HEAD:paramorph-0.0.3-dsl
          fi
