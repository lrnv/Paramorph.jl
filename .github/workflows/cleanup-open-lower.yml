name: Cleanup open-lower patch

on:
  push:
    branches:
      - paramorph-0.0.3-dsl

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paramorph-0.0.3-dsl
      - run: python dev/cleanup_open_lower.py
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Deduplicate strict lower-bound geometry"
            git push origin HEAD:paramorph-0.0.3-dsl
          fi
