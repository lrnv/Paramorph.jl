name: Auxiliary-aware type geometry

on:
  push:
    branches:
      - paramorph-0.0.3-dsl

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paramorph-0.0.3-dsl
      - name: Apply patch
        run: python dev/add_auxiliary_type_geometry.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Paramorph.jl
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Support auxiliary values in type-based geometry"
            git push origin HEAD:paramorph-0.0.3-dsl
          fi
