name: Apply prototype reconstruction binding fix

on:
  push:
    branches:
      - paramorph-0.0.3-dsl

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paramorph-0.0.3-dsl
      - name: Apply reconstruction fix
        run: python dev/fix_prototype_reconstruction_bindings.py
      - name: Commit reconstruction fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Paramorph.jl
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Bind fields during prototype reconstruction"
            git push origin HEAD:paramorph-0.0.3-dsl
          fi
